# CodeAtlas — local infrastructure
#
# Quick start:
#   docker compose -f infra/compose/compose.yml up -d
#
# Full stack (app + DB + Redis):
#   docker compose -f infra/compose/compose.yml --profile full up -d
#
# Note: if you already run a Postgres on 5432, either use that instance
# (create the `codeatlas` + `codeatlas_test` databases) or change the host
# port mapping below, e.g. "5433:5432".

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codeatlas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codeatlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: codeatlas:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../../.env.local
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres-data:
  redis-data:
